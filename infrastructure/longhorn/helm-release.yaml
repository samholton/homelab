apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: '1.13.0'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  values:
    # -- Persistence / storage defaults
    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 3
      defaultDataLocality: disabled
      reclaimPolicy: Delete
      dataEngine: v1
      disableRevisionCounter: '{"v1":"true"}'
    # -- HTTPRoute via Gateway API (replaces standalone http-route.yaml)
    httproute:
      enabled: true
      parentRefs:
        - name: traefik-internal
          namespace: traefik
      hostnames:
        - longhorn.samholton.com
      filters:
        - type: ExtensionRef
          extensionRef:
            name: longhorn-authentik
            kind: Middleware
            group: traefik.io
    # -- Disable Helm-managed ingress (we use httproute instead)
    ingress:
      enabled: false
