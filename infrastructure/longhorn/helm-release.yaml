apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: '1.11.3'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  values:
    # -- Persistence / storage defaults
    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 2
      defaultDataLocality: disabled
      reclaimPolicy: Delete
      dataEngine: v1
      disableRevisionCounter: '{"v1":"true"}'
    httproute:
      enabled: true
      parentRefs:
        - name: traefik-internal
          namespace: traefik
      hostnames:
        - longhorn.samholton.com
    ingress:
      enabled: false
