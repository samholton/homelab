apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: '42.4.1'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    gatewayClass:
      enabled: true
      name: traefik-external
      labels:
        gateway-instance: external
    deployment:
      kind: Deployment
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-external
        publishedService:
          enabled: true
      kubernetesGateway:
        enabled: true
        gatewayClass: "traefik-external"
    ports:
      traefik:
        port: 8080
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
    log:
      level: ERROR
    metrics:
      prometheus:
        enabled: true
    service:
      annotations:
        kube-vip.io/loadbalancerIPs: 192.168.100.17
      spec:
        externalTrafficPolicy: Local
