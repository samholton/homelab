apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-internal
  namespace: traefik
spec:
  gatewayClassName: traefik-internal
  addresses:
    - type: IPAddress
      value: 192.168.100.18
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
          - kind: Secret
            name: samholton-wildcard
      allowedRoutes:
        namespaces:
          from: All
