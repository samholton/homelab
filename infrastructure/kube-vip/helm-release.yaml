---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: '0.11.2'
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
  values:
    image:
      tag: v1.3.1

    env:
      cp_enable: "false"
      lb_enable: "false"
      vip_leaderelection: "false"
      vip_interface: "lo"
      vip_arp: "false"
      vip_subnet: "32"
      bgp_enable: "true"
      bgp_routerinterface: "ens18"
      bgp_as: "64500"
      bgp_peeraddress: "192.168.2.1"
      bgp_peeras: "64501"
      svc_enable: "true"
      svc_election: "true"
      prometheus_server: ":2112"

    tolerations: []
