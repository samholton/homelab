apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      hostNetwork: true
      containers:
      - name: kube-vip
        image: ghcr.io/kube-vip/kube-vip:v0.8.2
        imagePullPolicy: IfNotPresent
        args:
        - manager
        env:
        # Control plane VIP management (replaces static pod manifests)
        - name: cp_enable
          value: "true"
        - name: cp_namespace
          value: kube-system
        # API server port
        - name: port
          value: "6443"
        # VIP address — should be the control plane load balancer VIP
        - name: address
          value: 192.168.2.30
        # Network configuration
        - name: vip_arp
          value: "false"
        - name: vip_nodename
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: vip_interface
          value: lo
        - name: vip_cidr
          value: "32"
        - name: dns_mode
          value: first
        # Service load balancer support (for worker nodes)
        - name: svc_enable
          value: "true"
        - name: svc_leasename
          value: plndr-svcs-lock
        - name: svc_election
          value: "true"
        # BGP configuration — no password, uses node-specific source IP automatically
        - name: bgp_enable
          value: "true"
        - name: bgp_routerinterface
          value: "ens18"
        - name: bgp_as
          value: "64500"
        - name: bgp_peeraddress
          value: 192.168.2.1
        - name: bgp_peeras
          value: "64501"
        # Metrics
        - name: prometheus_server
          value: :2113
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        # Mount kubeconfig for health checks against the API server
        - mountPath: /etc/kubernetes/admin.conf
          name: kubeconfig
      hostAliases:
      - hostnames:
        - kubernetes
        ip: 127.0.0.1
      serviceAccountName: kube-vip
      tolerations:
      # Allow scheduling on control plane nodes with NoSchedule taint
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoExecute
      volumes:
      # Provide kubeconfig so kube-vip can check API server health
      - hostPath:
          path: /etc/kubernetes/admin.conf
        name: kubeconfig
