apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-vaultwarden
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: vaultwarden
        folder: Security
        interval: 1m
        rules:
          - uid: cd83165a-bd5d-4368-88df-4125b8925707
            title: Vaultwarden Incorrect Login
            condition: C
            data:
              - refId: A
                datasourceUid: loki
                relativeTimeRange:
                  from: 3600
                  to: 0
                model:
                  datasource:
                    type: loki
                    uid: loki
                  editorMode: code
                  expr: 'sum(count_over_time({namespace="vaultwarden"} |= "Username or password is incorrect" | regexp "(?P<log>.+)" [2m])) by (log)'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  queryType: instant
                  refId: A
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 3600
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            labels:
              severity: warning
              team: security
            annotations:
              summary: "Failed Vaultwarden login attempt"
              description: "Log line: {{ $labels.log }}"
            noDataState: NoData
            execErrState: Alerting
            for: 1m
            isPaused: false
