apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-internal
      namespace: traefik
      sectionName: https
  hostnames:
    - "grafana.samholton.com"
  rules:
    - backendRefs:
        - name: prometheus-grafana
          port: 80
