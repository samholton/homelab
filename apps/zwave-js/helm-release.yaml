apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js
  namespace: zwave-js
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1
    controllers:
      main:
        containers:
          main:
            image:
              repository: zwavejs/zwave-js-ui
              tag: 11.27.0
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 10
                  httpGet:
                    httpHeaders:
                    - name: Accept
                      value: text/plain
                    path: /health
                    port: http
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: "1"
                memory: 400Mi
            securityContext:
              privileged: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 8091
          websocket:
            port: 3000
    route:
      main:
        hostnames:
          - zwave-js.samholton.com
        parentRefs:
          - name: traefik-internal
            namespace: traefik
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  name: authentik-forward-auth
                  kind: Middleware
                  apiGroup: traefik.io
            backendRefs:
              - name: zwave-js
                port: 8091
    persistence:
      zwave-usb:
        enabled: true
        type: hostPath
        hostPath: /dev/ttyACM0
        advancedMounts:
          main:
            main:
              - path: /dev/zwave
      data:
        existingClaim: zwave-js-data
        advancedMounts:
          main:
            main:
              - path: /usr/src/app/store
