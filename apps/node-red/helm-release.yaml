apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: node-red
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: nodered/node-red
              tag: 5.0.10
            env:
              TZ: "America/New_York"
    service:
      main:
        controller: main
        ports:
          http:
            port: 1880
    route:
      main:
        hostnames:
          - node-red.samholton.com
        parentRefs:
          - name: traefik-internal
            namespace: traefik
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        existingClaim: node-red-data
